name: LifeOS Quality & Security CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Test, Build & Architectural Governance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript verification (Typecheck)
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint -- --quiet

      - name: Run Vitest Suite
        run: npm test

      - name: Build Extension (Vite/Rolldown)
        run: npm run build

      - name: Run Architectural Layer & Multi-Responsibility Analyzers
        run: node scripts/runAnalyzers.mjs

      - name: Verify No Dead or Unimported Source Files
        run: node scripts/findDeadFiles.mjs

      - name: Verify i18n Localization Integrity
        run: node scripts/i18nHealthCheck.mjs
