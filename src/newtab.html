<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenTodo - Focus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="newtab.css">
</head>
<body>
    <div class="background-overlay"></div>
    
    <button id="sidebar-toggle" class="sidebar-toggle">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>

    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2 class="logo">ZenTodo</h2>
        </div>
        <nav class="sidebar-nav">
            <button id="nav-focus-btn" class="sidebar-btn active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                <span data-i18n="section_tasks">Odağım</span>
            </button>
            <button id="nav-routines-btn" class="sidebar-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>
                <span data-i18n="section_recurring">Rutinler</span>
            </button>
            <div class="sidebar-divider"></div>
            <button id="view-list-btn" class="sidebar-btn active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                <span data-i18n="view_list">Liste</span>
            </button>
            <button id="view-kanban-btn" class="sidebar-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
                <span data-i18n="view_kanban">Kanban</span>
            </button>
            <div class="sidebar-divider"></div>
            <button id="settings-btn" class="sidebar-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span data-i18n="settings_title">Ayarlar</span>
            </button>
        </nav>
    </aside>

    <div id="settings-panel" class="settings-panel">
        <div class="settings-content">
            <header class="settings-header">
                <h2 data-i18n="settings_title">Ayarlar</h2>
                <button id="settings-close" class="close-btn">&times;</button>
            </header>
            
            <div class="settings-group">
                <h3 data-i18n="settings_data_title">Veri Yönetimi</h3>
                <div class="settings-actions">
                    <button id="lang-toggle-btn" class="settings-action-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                        <span data-i18n="change_lang">Dil Değiştir</span>
                        <span id="lang-text" style="margin-left: auto; font-weight: 700; color: var(--accent-color);">TR</span>
                    </button>
                    <button id="backup-btn" class="settings-action-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        <span data-i18n="backup">Yedek Al</span>
                    </button>
                    <button id="restore-btn" class="settings-action-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        <span data-i18n="restore">Yedekten Yükle</span>
                    </button>
                    <button id="clear-all-btn" class="settings-action-btn danger">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        <span data-i18n="clear_all">Tüm Verileri Temizle</span>
                    </button>
                </div>
                <input type="file" id="restore-input" accept=".json" style="display: none;">
            </div>
        </div>
    </div>

    <header class="top-header">
        <div class="global-input-container">
            <div class="input-group">
                <input type="text" id="todo-input" placeholder="Yeni görev ekle..." autocomplete="off">
                <select id="repeat-select" class="repeat-select">
                    <option value="none" data-i18n="repeat_none">Tekrar Yok</option>
                    <option value="daily" data-i18n="repeat_daily">Günlük</option>
                    <option value="weekly" data-i18n="repeat_weekly">Haftalık</option>
                    <option value="monthly" data-i18n="repeat_monthly">Aylık</option>
                </select>
                <button id="add-btn" aria-label="Add Task">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <header class="hero">
            <div id="clock" class="clock">00:00</div>
            <div id="date" class="date">Wednesday, April 15</div>
        </header>

        <!-- List View -->
        <section id="list-view" class="view-content active">
            <div class="todo-card">
                <h1 class="greeting" data-i18n="greeting">Bugünkü odağın nedir?</h1>

                <div class="sections-grid single-column">
                    <div id="tasks-section" class="tasks-container active">
                        <h2 class="section-title" data-i18n="section_tasks">Odağım</h2>
                        <ul id="todo-list" class="todo-list">
                            <!-- One-time tasks -->
                        </ul>
                    </div>

                    <div id="recurring-section" class="tasks-container">
                        <h2 class="section-title" data-i18n="section_recurring">Rutinler</h2>
                        <ul id="recurring-list" class="todo-list">
                            <!-- Recurring tasks -->
                        </ul>
                    </div>
                </div>

                <div id="empty-state" class="empty-state">
                    <p data-i18n="empty_state">Her şey tamam! Biraz dinlenme zamanı.</p>
                </div>
            </div>
        </section>

        <!-- Kanban View -->
        <section id="kanban-view" class="view-content">
            <div class="kanban-board">
                <div class="kanban-column" id="col-todo">
                    <h3 class="kanban-title" data-i18n="kanban_todo">Yapılacak</h3>
                    <div class="kanban-list" data-status="todo"></div>
                </div>
                <div class="kanban-column" id="col-in-progress">
                    <h3 class="kanban-title" data-i18n="kanban_in_progress">Yapılıyor</h3>
                    <div class="kanban-list" data-status="in-progress"></div>
                </div>
                <div class="kanban-column" id="col-done">
                    <h3 class="kanban-title" data-i18n="kanban_done">Bitti</h3>
                    <div class="kanban-list" data-status="done"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p id="quote">"The secret of getting ahead is getting started."</p>
    </footer>

    <script type="module" src="newtab.js"></script>
</body>
</html>
